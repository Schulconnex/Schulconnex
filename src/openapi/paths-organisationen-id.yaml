get:
  tags:
    - Organisationen
  operationId: readOrganisationId
  security:
    - oAuthForServices: []
  summary: Organisation zur angeforderten ID
  description: |
    Die Schnittstelle `/organisationen/{organisation.id}` bezieht sich auf das Anfordern
    einer Organisation per ID.

    Dieser Schnittstellenendpunkt gibt die Organisation zur angegebenen `organisation.id` zurück.

    Ein READ zum Abfragen einer Organisation per ID muss mit HTTP-GET auf die API `/organisationen/{organisation.id}`erfolgen. Die Antwort-Nutzdaten (Response Payload) beinhalten
    ein JSON-Objekt des Datentyps Organisation.

    Siehe auch Datenmodell [`Organisation`](../../../datenmodell-qs/organisation).
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        example: 9b3f36ad-9d15-49f9-9660-6cf9746ba446
      description: Der Pfad-Parameter bezieht sich auf die ID der Organisation.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './components-Organisation-basis.yaml'
              - $ref: './components-Organisation.yaml'
              - $ref: './components-qs-Organisation.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
delete:
  tags:
    - Organisationen
  operationId: deleteOrganisationId
  security:
    - oAuthForServices: []
  summary: Löscht die Organisation zur angeforderten ID
  description: |
    Dieser Schnittstellenendpunkt löscht die Organisation zur angegebenen `organisation.id`.

    Ein DELETE zum Löschen einer Organisation per `organisation.id` muss mit HTTP-DELETE
    auf die API `/organisationen/{organisation.id}` erfolgen. 
    Die Anfrage-Nutzdaten (Request Payload) beinhalten die Revisionsnummer.

    Diese API ist häufig nur als interne API für den Betreiber einens Schulconnex-Servers 
    zur Durchführung administrativer Funktionen verfügbar.
  
    Es ist erforderlich, dass für eine Löschanfrage einer Organisation das Attribut revision 
    der zugrunde liegenden Organisation mitgeschickt wird. Der Anmeldeservice überprüft anhand
    des mitgeschickten Werts des Attributs revision, ob der Datensatz der Organisation in der
    Zwischenzeit keine Änderung erfahren hat.

    Bei einer erfolgreichen Ausführung der Löschanfrage wird es keine Antwort-Nutzdaten
    (Response Payload) geben. Eine erfolgreiche Löschanforderung einer Organisation
    per ID wird mit dem HTTP-Statuscode 204 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 1fd95f6f-bc28-408b-8e03-41972b414a07
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Organisation.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - revision
          properties:
            revision:
              type: string
              description: Revision der zugrunde liegenden Organisation. Dieses Feld ist ein Pflichtfeld.
  responses:
    '204':
      description: |
        No Content

        Bei einer erfolgreichen Ausführung der Löschanfrage wird es keine Antwort-Nutzdaten (Response Payload) geben.
    '304':
      description: |
        Not Modified

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '501':
      description: |
        Not Implemented

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
put:
  tags:
    - Organisationen
  operationId: updateOrganisationId
  security:
    - oAuthForServices: []
  summary: Aktualisiert die Organisation zur angeforderten ID
  description: |
    Dieser Schnittstellenendpunkt aktualisiert die Organisation zur angegebenen
    ` organisation.id`.

    Ein UPDATE zum Aktualisieren einer Organisation per ID muss mit HTTP-PUT auf die API `/organisationen/{organisation.id}`
    erfolgen. Die Anfrage-Nutzdaten
    (Request Payload) beinhalten ein JSON-Objekt des Datentyps Organisation.

    Siehe auch das Datenmodell zu [`Organisation`](../../../datenmodell-dienste/organisation).
    
    Diese API ist häufig nur als interne API für den Betreiber einens Schulconnex-Servers 
    zur Durchführung administrativer Funktionen verfügbar.

    Es ist erforderlich, dass zur Aktualisierungsanfrage in der bearbeiteten Organisation
    das Attribut `revision` der zugrunde liegenden Organisation mitgeschickt wird.
    Der Schulconnex-Server überprüft anhand des mitgeschickten Werts des Attributs `revision`,
    ob der Datensatz der Organisation in der Zwischenzeit keine Änderung erfahren
    hat. Der Wert des Attributs kann von einem Quellsystem oder Dienst nicht verändert
    werden; dieser wird mit der Erstellung (Create) des Datensatzes Organisation
    und jeder erfolgreichen Änderung (Update) vom Schulconnex-Server neu generiert.

    Die folgende Tabelle listet die Attribute einer Organisation auf, welche von einem Quellsystem oder Dienst nicht verändert werden können.

    Attribut | Bemerkung
    --- | ---
    `id` | ID der Organisation. Wird vom Schulconnex-Server vergeben und ist eindeutig. Dieses Attribut ist unveränderbar (immutable).
    `revision` | Revision der Organisation. Wird vom Schulconnex-Server mit der Erstellung des Datensatzes sowie Aktualisierung generiert. Dieser Wert kann nicht von Quellsystemen oder Diensten gesetzt werden.

    Die ID kann im Request ausgelassen werden. Ist das Attribut im Request dennoch
    vorhanden, wird es validiert und führt gegebenenfalls zu einer Fehlermeldung.

    Anmerkung: Bei dieser Aktualisierungsanfrage handelt es sich um eine HTTP-PUT-Operation,
    bei der die Anfrage-Nutzlast mit den gegebenen Attributen der Aktualisierung zugrunde
    gelegt wird (mitgeschickte Attribute werden aktualisiert, nicht mitgeschickte Attribute
    werden gelöscht); es ist keine HTTP-PATCH-Operation, bei der lediglich die zu aktualisierenden
    Attribute in der Anfrage-Nutzlast mitgeschickt werden.

    Bei einer erfolgreichen Anforderung zum Aktualisieren einer Organisation
    wird diese Anforderung mit einer Repräsentation der Organisation in den
    Antwort-Nutzdaten und dem HTTP-Statuscode 200 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: grupz_2343_eng
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Organisation.    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          allOf:
            - $ref: './components-Organisation-PUT-request.yaml'
            - $ref: './components-qs-Organisation.yaml'            
  responses:
    '201':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: './components-Organisation-basis.yaml'
              - $ref: './components-Organisation.yaml'
              - $ref: './components-qs-Organisation.yaml'
    '304':
      description: Not Modified
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '501':
      description: |
        Not Implemented

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)