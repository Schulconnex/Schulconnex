get:
  tags:
    - Bewertungslisten
  operationId: readBewertungslisteId
  security:
    - oAuthForServices: []
  summary: Bewertungsliste zur angeforderten ID
  description: |
    Dieser Schnittstellenendpunkt gibt den Bewertungslistendatensatz zur angegebenen
    `bewertungsliste.id` zurück.

    Siehe auch die Datenmodelle zu [`Bewertungslistendatensatz`](../../../datenmodell-qs/bewertungslistendatensatz),
    [`Bewertungsliste`](../../../datenmodell-qs/bewertungsliste) und [`Bewertung`](../../../datenmodell-qs/bewertung).

    Ein READ zum Abfragen eines Bewertungslistendatensatzes per ID muss mit HTTP-GET auf die API `/bewertungslisten/{bewertungsliste.id}`
    erfolgen. Die Antwort-Nutzdaten (Response Payload) beinhalten ein JSON-Objekt des Datentyps Bewertungsliste.
 
    Es steht eine Filterfunktion zur Verfügung:

    Filter | Typ | Beschreibung
    --- | --- | ---
    `bewertungen` | String |  Dieser Filterparameter erlaubt festzulegen, ob und in welchem Umfang die Bewertungen in der Antwort-Nutzlast (Response Payload) enthalten sein sollen. Mögliche Werte sind: `keine` (keine Bewertungen), `ids` (nur die IDs der Bewertungen) und `vollstaendig` (die vollständigen Bewertungsobjekte). Standardmäßig werden keine Bewertungen zurückgegeben, wenn dieser Filterparameter nicht angegeben ist.
  
    Siehe auch das Datenmodell zu [`Bewertungsliste`](../../../datenmodell-qs/bewertungsliste).

  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 49fb2c4a-43be-41e8-8f18-3c70fc6aa870
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Bewertungsliste.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Bewertungslistendatensatz.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
put:
  tags:
    - Bewertungslisten
  operationId: updateBewertungslisteId
  security:
    - oAuthForServices: []
  summary: Aktualisiert die Bewertungsliste der angegebenen ID
  description: |
    Dieser Schnittstellenendpunkt aktualisiert die Bewertungsliste zur angegebenen
    `bewertungsliste.id`.

    Ein UPDATE zum Aktualisieren einer Bewertungsliste per ID muss mit HTTP-PUT auf die API `/bewertungslisten/{bewertungsliste.id}`
    erfolgen. Die Anfrage-Nutzdaten (Request Payload) beinhalten ein JSON-Objekt des Datentyps Bewertungsliste.

    Siehe auch das Datenmodell zu [`Bewertungsliste`](../../../datenmodell-qs/bewertungsliste).

    Es ist erforderlich, dass zur Aktualisierungsanfrage in der bearbeiteten Bewertungsliste
    das Attribut `revision` der zugrunde liegenden Bewertungsliste mitgeschickt wird.
    Der Schulconnex-Server überprüft anhand des mitgeschickten Werts des Attributs `revision`,
    ob der Datensatz der Bewertungsliste in der Zwischenzeit keine Änderung erfahren
    hat. Der Wert des Attributs kann von einem Quellsystem oder Dienst nicht verändert
    werden; dieser wird mit der Erstellung (Create) des Datensatzes Bewertungsliste
    und jeder erfolgreichen Änderung (Update) vom Schulconnex-Server neu generiert.

    Die folgende Tabelle listet die Attribute einer Bewertungsliste auf, welche von einem Quellsystem oder Dienst nicht verändert werden können.

    Attribut | Bemerkung
    --- | ---
    `id` | ID der Bewertungsliste. Wird vom Schulconnex-Server vergeben und ist eindeutig. Dieses Attribut ist unveränderbar (immutable).
    `revision` | Revision der Bewertungsliste. Wird vom Schulconnex-Server mit der Erstellung des Datensatzes sowie Aktualisierung generiert. Dieser Wert kann nicht von Quellsystemen oder Diensten gesetzt werden.

    Die ID kann im Request ausgelassen werden. Ist das Attribut im Request dennoch
    vorhanden, wird es validiert und führt gegebenenfalls zu einer Fehlermeldung.

    Anmerkung: Bei dieser Aktualisierungsanfrage handelt es sich um eine HTTP-PUT-Operation,
    bei der die Anfrage-Nutzlast mit den gegebenen Attributen der Aktualisierung zugrunde
    gelegt wird (mitgeschickte Attribute werden aktualisiert, nicht mitgeschickte Attribute
    werden gelöscht); es ist keine HTTP-PATCH-Operation, bei der lediglich die zu aktualisierenden
    Attribute in der Anfrage-Nutzlast mitgeschickt werden.

    Bei einer erfolgreichen Anforderung zum Aktualisieren einer Bewertungsliste
    wird diese Anforderung mit einer Repräsentation der Bewertungsliste in den
    Antwort-Nutzdaten und dem HTTP-Statuscode 200 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 49fb2c4a-43be-41e8-8f18-3c70fc6aa870
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Gruppenzugehörigkeit.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './components-qs-Bewertungsliste-PUT-request.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Bewertungsliste.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
patch:
  tags:
    - Bewertungslisten
  operationId: patchBewertungslisteId
  security:
    - oAuthForServices: []
  summary: Modifiziert die Bewertungsliste der angegebenen ID
  description: |
    Dieser Schnittstellenendpunkt modifiziert die Bewertungsliste zur angegebenen
    `bewertungsliste.id`.

    Die Modifikation einer Bewertungsliste per ID muss mit HTTP-PATCH auf die API `/bewertungslisten/{bewertungsliste.id}`
    erfolgen. Die Anfrage-Nutzdaten
    (Request Payload) beinhalten ein JSON-Objekt des Datentyps Bewertungsliste.

    Siehe auch das Datenmodell zu [`Bewertungsliste`](../../../datenmodell-qs/bewertungsliste).

    Es ist erforderlich, dass zur Modifikationsanfrage in der bearbeiteten Bewertungsliste
    das Attribut `revision` der zugrunde liegenden Bewertungsliste mitgeschickt wird.
    Der Schulconnex-Server überprüft anhand des mitgeschickten Werts des Attributs `revision`,
    ob der Datensatz der Bewertungsliste in der Zwischenzeit keine Änderung erfahren
    hat. Der Wert des Attributs kann von einem Quellsystem oder Dienst nicht verändert
    werden; dieser wird mit der Erstellung (Create) des Datensatzes Bewertungsliste
    und jeder erfolgreichen Änderung (Update) vom Schulconnex-Server neu generiert.

    Die folgende Tabelle listet die Attribute einer Bewertungsliste auf, welche von einem Quellsystem oder Dienst nicht verändert werden können.

    Attribut | Bemerkung
    --- | ---
    `id` | ID der Bewertungsliste. Wird vom Schulconnex-Server vergeben und ist eindeutig. Dieses Attribut ist unveränderbar (immutable).
    `revision` | Revision der Bewertungsliste. Wird vom Schulconnex-Server mit der Erstellung des Datensatzes sowie Aktualisierung generiert. Dieser Wert kann nicht von Quellsystemen oder Diensten gesetzt werden.

    Die ID kann im Request ausgelassen werden. Ist das Attribut im Request dennoch
    vorhanden, wird es validiert und führt gegebenenfalls zu einer Fehlermeldung.

    Dieser Endpunkt stellt eine HTTP-PATCH Operation bereit,
    bei der ausschließlich die zu modifizierenden Attribute in der Anfrage-Nutzlast mitgeschickt werden müssen.
    Werte von Attributen, welche nicht in der Anfrage-Nutzlast mitgeschickt werden, bleiben unverändert.

    Wichtig ist hierbei, dass das Array `grids` in der Anfrage-Nutzlast 
    vollständig mit den gewünschten Werten der Modifikation mitgeschickt werden müssen. 
    Wird ein Array mit nur einem Wert übermittelt, wird das Array auf dem Schulconnex-Server auf diesen einen Wert gesetzt. 
    Der Wert wird nicht den vorhandenen Werten hinzugefügt. Entsprechen ist das Verhalten
    auch bei einem Array mit mehreren Einträgen. Werden diese Attribute mit einem leeren Array übermittelt, 
    werden die Werte auf dem Schulconnex-Server gelöscht.

    Bei einer erfolgreichen Anforderung zum Aktualisieren einer Bewertungsliste
    wird diese Anforderung mit einer Repräsentation der Bewertungsliste  in den
    Antwort-Nutzdaten und dem HTTP-Statuscode 200 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 49fb2c4a-43be-41e8-8f18-3c70fc6aa870
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Bewertungsliste.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './components-qs-Bewertungsliste-PATCH-request.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Bewertungsliste.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
delete:
  tags:
    - Bewertungslisten
  operationId: deleteBewertungslisteId
  security:
    - oAuthForServices: []
  summary: Löscht die Bewertungsliste zur angeforderten ID
  description: |
    Dieser Schnittstellenendpunkt löscht die Bewertungsliste zur angegebenen
    `bewertungsliste.id`.

    Ein DELETE zum Löschen einer Bewertungsliste per `bewertungsliste.id` muss mit HTTP-DELETE auf die API `/bewertungslisten/{bewertungsliste.id}`
    erfolgen. 

    Siehe auch das  Datenmodell zu [`Bewertungsliste`](../../../datenmodell-qs/bewertungsliste).

    Es ist erforderlich, dass für eine Löschanfrage einer Bewertungsliste das
    Attribut `revision` der zugrunde liegenden Bewertungsliste mitgeschickt wird.
    Der Schulconnex-Server überprüft anhand des mitgeschickten Werts des Attributs
    `revision`, ob der Datensatz der Bewertungsliste in der Zwischenzeit keine Änderung
    erfahren hat.

    Wird eine Bewertungsliste gelöscht, werden auch alle Bewertungen, die zu dieser Bewertungsliste gehören, gelöscht.

    Bei einer erfolgreichen Ausführung der Löschanfrage wird es keine Antwort-Nutzdaten
    (Response Payload) geben. Eine erfolgreiche Löschanforderung einer Bewertungsliste
    per ID wird mit dem HTTP-Statuscode 204 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 49fb2c4a-43be-41e8-8f18-3c70fc6aa870
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Bewertungsliste.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - revision
          properties:
            revision:
              type: string
              description: Revision der Bewertungsliste.
  responses:
    '204':
      description: |
        No Content

        Bei einer erfolgreichen Ausführung der Löschanfrage wird es keine Antwort-Nutzdaten (Response Payload) geben.
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
