post:
  tags:
    - Organisationen
    - Organisationsbeziehungen
  operationId: createOrganisationsbeziehung
  security:
    - oAuthForServices: []
  summary: Erstellen einer Organisationsbeziehung
  description: |
    Die Schnittstelle `/organisationen/{id}/organisationsbeziehungen` erlaubt
    das Erstellen einer Organisationsbeziehung für eine Organisatiom

    Organisationsbeziehungen sind immer von der Form „hat_als“. Besteht zum Beispiel
    von Organisation A eine Organisationsbeziehung vom Typ `Medienzentrum` zu einer Organisation B,
    so bedeutet dieses, dass Organisation A die Organisation B als Medienzentrum hat.

    Ein CREATE zum Erstellen von Organisationsbeziehungen muss mit HTTP-POST auf die API 
    `/organisationen/{id}/organisationsbeziehungen` erfolgen. Die Anfrage-Nutzdaten
    (Request Payload) beinhalten ein JSON-Objekt des Datentyps Organisationsbeziehung.

    Siehe auch Datenmodell [`Organisationsbeziehung`](../../../datenmodell-qs/organisationsbeziehung).

    Diese API ist häufig nur als interne API für den Betreiber einens Schulconnex-Servers 
    zur Durchführung administrativer Funktionen verfügbar.

    Bestehen zwischen zwei Organisationen mehrere Organisationsbeziehungen, so ist
    für jede Einzelbeziehung ein eigenes Organisationsbeziehungsobjekt zu erstellen.

    Die folgende Tabelle listet die Attribute einer Organisationsbeziehung auf, welche von einem
    Quellsystem oder Dienst nicht verändert werden können.

    Attribut | In den Anfrage-Nutzdaten erforderlich? | Bemerkung
    --- | --- | ---
    `id` | nein | ID der Organisationsbeziehung. Wird vom Schulconnex-Server vergeben und ist eindeutig. Dieses Attribut ist unveränderbar (immutable).
    `revision` | nein | Revision der Organisationsbeziehung. Wird vom Schulconnex-Server mit der Erstellung des Datensatzes sowie Aktualisierung generiert. Dieser Wert kann nicht von Quellsystemen oder Diensten gesetzt werden.

    Bei einer erfolgreichen Anforderung zum Erstellen einer Organisationsbeziehung
    wird diese Anforderung mit einer Repräsentation der Beziehung in den Antwort-Nutzdaten
    und dem HTTP-Statuscode 201 quittiert.
  parameters:
    - in: path
      name: id
      schema:
        type: string
        example: 4d0f579c-0b9a-4d3a-b484-87b3bee8a2ad
      required: true
      description: Der Pfad-Parameter bezieht sich auf die ID der Organisation welche die Organisationsbeziehung hat
  requestBody:
    required: true
    content:
      application/json:
        schema:
        type: object
        properties:
          orgid:
            required: true
            description: ID der Organisation.
            type: string
            example: 9b3f36ad-9d15-49f9-9660-6cf9746ba446
          organisationsbeziehung:
            required: true
            description: Beziehung aus Codeliste [Organisationsbeziehungen](../../../codelisten#organisationsbeziehungen).
            type: string
            example: SchBeh
  responses:
    '201':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Organisationsbeziehung.yaml'
    '400':
      description: |
        Bad Request

        Subcode 18: „Beziehung kann nicht erstellt werden.“ Dieser Fehler wird gemeldet,
        wenn die zu erstellende Organisationsbeziehung nicht unterstützt werden kann.        

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
get:
  tags:
    - Organisationen
  operationId: readOrganisationIdOrganisationsbeziehungen
  security:
    - oAuthForServices: []
  summary: Auflistung von Organisationsbeziehungen
  description: |
    Die Schnittstelle `/organisationen/{id}/organisationsbeziehungen` erlaubt das
    Lesen von zu einer Organisation gehörenden Organisationsbeziehungen.

    Organisationsbeziehungen sind immer von der Form `hat_als`. Besteht von einer
    Organisation A eine Organisationsbeziehung vom Typ `SchBeh` zu einer
    Organisation B, so bedeutet dieses, das Organisation A die Organisation B
    als Schulbehörde hat.

    Bestehen zwischen zwei Organisationen mehrere Beziehungen (ist beispielsweise
    eine Organisation sowohl Schulbehörde als auch Schulträger einer anderen Organisation),
    so hat jede Beziehung ein eigenes Organisationsbeziehungsobjekt.

    Dieser Schnittstellenendpunkt gibt die Organisationsbeziehungen zur angegebenen
    Organisations-ID zurück.

    Ein READ zum Abfragen der Organisationsbeziehungen per Organisations-ID muss mit HTTP-GET auf die API `/organisationen/{id}/organisationsbeziehungen`
    erfolgen. Die
    Antwort-Nutzdaten (Response Payload) beinhalten ein JSON-Objekt mit einem Array
    des Datentyps Organisationsbeziehungen.

    Siehe auch Datenmodell [`Organisationsbeziehung`](../../../datenmodell-qs/organisationsbeziehung).

    Die Schnittstelle `/organisationen/{id}/organisationsbeziehungen` ermöglicht das
    Verwenden von Filterparametern zur Präzisierung der Anfrage bei HTTP-GET.
    Entsprechen keine Werte den angegebenen Filtern, so wird als Resultat eine leere Liste geliefert.

    Folgende Tabelle listet die zur Verfügung stehenden Filter auf:

    Filter | Typ | Beschreibung
    --- | --- | ---
    `hat_als_organisationsbeziehungen` | String (Boolean) | Listet alle Organisationsbeziehungen auf, welche die durch die Organsations-ID gegebene Organisation hat. Die Organisationsbeziehungen werden unter `hat_als_organisationsbeziehungen` aufgelistet. Der Defaultwert ist `Ja`, es werden also ohne Filterangabe alle Organisationsbeziehungen angegeben, welche eine Organisation hat.
    `ist_von_organisationsbeziehungen` | String (Boolean) | Listet alle Organisationsbeziehungen auf, welche von anderen Organisationen zu dem, durch die Organisations-ID gegebenen, Organisation bestehen. Die Organisationsbeziehungen werden unter `ist_von_organisationsbeziehungen` aufgelistet. Der Defaultwert ist `Nein`, es werden also ohne Filterangabe keine Organisationsbeziehungen angegeben, welche aus der gegebenen Organisation heraus bestehen.
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        example: 9b3f36ad-9d15-49f9-9660-6cf9746ba446
      description: Der Pfad-Parameter bezieht sich auf die ID der Organisation.
    - in: query
      name: hat_als_organisationsbeziehungen
      schema:
        type: string
        enum:
          - Ja
          - Nein
    - in: query
      name: ist_von_organisationsbeziehungen
      schema:
        type: string
        enum:
          - Ja
          - Nein
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Organisationsbeziehungen.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
