get:
  tags:
    - Gruppen
  operationId: readGruppenInfoOrgID 
  security:
    - oAuthForServices: []
  summary: Lesen von Gruppen einer Organisation
  description: |
    Dieser Schnittstellenendpunkt gibt ein Array von Gruppen zurück, die einer spezifischen Organisation zugeordnet sind.

    Dieser Schnittstellenendpunkt gibt die Gruppen zur angegebenen `organisation.id` zurück.

    Ein READ zum Abfragen der Gruppen per Organisations-ID muss mit HTTP-GET auf die API `/gruppen-info/{organisation.id}` erfolgen. Die Antwort-Nutzdaten (Response Payload) beinhalten ein
    JSON-Objekt mit einem Array von Objekten des Datentyps Gruppe.

    Siehe auch das Datenmodelle zu [`Gruppe`](../../../datenmodell-dienste/gruppe).

    Die Anfrage erfordert keine Nutzdaten (Request Payload).
  parameters:
  - in: path
    name: orgid
    schema:
      type: string
      example: e70663cb-65c4-4ad5-a9f1-7edbc3c36c4b
    required: true
    description: Der Pfad-Parameter bezieht sich auf die ID der Organisation.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:                      
              $ref: './components-dienste-Gruppe.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
