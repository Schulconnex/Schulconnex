get:
  tags:
    - Organisationen
  operationId: readOrganisationen
  security:
    - oAuthForServices: []
  summary: Auflistung von Organisationen
  description: |
    Die Schnittstelle `/organisationen` bezieht sich auf die Auflistung von Organisationen.

    Die Schnittstelle `/organisationen` ermöglicht das Verwenden von Filterparametern zur
    Präzisierung der Anfrage bei HTTP-GET. Werden mehrere Filter angegeben, so sind sie als
    mit „und“ verknüpft anzusehen. Die mehrfache Nutzung des gleichen Filters in einer Anfrage
    darf nicht erfolgen. Entsprechen keine Werte den angegebenen Filtern, so wird als Resultat eine leere Liste geliefert. Folgende Tabelle listet die zur Verfügung stehenden Filter auf:

    Filter | Typ | Beschreibung
    --- | --- | ---
    `kennung` | String | Möglichkeit, die Ergebnisliste der Anfrage nach `kennung` zu filtern. Der Schulconnex-Server überprüft, ob der Wert des Filterparameters ohne Beachtung von Groß- und Kleinschreibung im Filter-Attribut beinhaltet ist (contains).
    `name` | String | Möglichkeit, die Ergebnisliste der Anfrage nach dem Attribut `organisation.name` zu filtern. Der Schulconnex-Server überprüft, ob der Wert des Filterparameters ohne Beachtung von Groß- und Kleinschreibung im Filter-Attribut beinhaltet ist (contains).
    `typ` | String (Code) | Möglichkeit, die Ergebnisliste der Anfrage nach dem Attribut `organisation.typ` zu filtern. Der Schulconnex-Server überprüft, ob der Wert des Filterparameters mit dem Wert des Filter-Attributs übereinstimmt (equals). Dem Filterparameter liegt eine Codeliste (Organisationstyp) zugrunde.
    `hat_als_organisationsbeziehungen` | String | Erlaubt es, wenn als Wert `ja` angegeben wird, zu Organisation auch die `hat_als`-Organisationsbeziehungen mit auszugeben. Diese Ausgabe ist nur eine Vereinfachung beim Auslesen. Das Attribut `organisationsbeziehungen` ist nicht Teil des Datenmodels [`Organisation`](../../../datenmodell-qs/organisation) und kann auch nicht mittels einer UPDATE Funktion auf [`Organisation`](../../../datenmodell-qs/organisation) gesetzt werden.

    Dieser Schnittstellenendpunkt gibt die Organisationen zurück, die vom Anfrager ausgelesen
    werden dürfen.

    Ein READ muss mit einer HTTP-GET Anfrage erfolgen. Die Antwort-Nutzdaten
    (Response Payload) beinhalten ein Array von JSON-Objekten vom Datentyp Organisation,
    sofern Einträge (ggf. passend zu den optionalen Filtern) existieren.

    Siehe auch Datenmodell [`Organisation`](../../../datenmodell-qs/organisation).
  parameters:
    - in: query
      name: kennung
      schema:
        type: string
    - in: query
      name: name
      schema:
        type: string
    - in: query
      name: typ
      schema:
        type: string
    - in: query
      name: hat_als_organisationsbeziehungen
      schema:
        type: string             
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Organisationen-GET-request.yaml'
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
post:
  tags:
    - Organisationen
  operationId: createOrganisation
  security:
    - oAuthForServices: []
  summary: Erstellen eines Organisationsdatensatzes
  description: |
    Mittels dieser Schnittstelle wird ein neuer Datensatz „Organisation“ erstellt.

    Ein CREATE zum Erstellen von Organisationendatensätzen muss mit HTTP-POST auf die API `/organisationen`
    erfolgen. Die Anfrage-Nutzdaten (Request Payload) beinhalten ein JSON-Objekt des Datentyps
    Organisation. Siehe auch die einzelnen Datenmodell zu
    [`Organisation`](../../../datenmodell-qs/organisation).

    Die folgende Tabelle listet die Attribute einer Organisation auf,
    welche von einem Quellsystem oder Dienst nicht gesetzt werden können.

    Attribut | In den Anfrage-Nutzdaten erforderlich? | Bemerkung
    --- | --- | ---
    `id` | nein | ID der Organisation. Wird vom Schulconnex-Server vergeben und ist eindeutig. Dieses Attribut ist unveränderbar (immutable).
    `revision` | nein | Revision der Organisation. Wird vom Schulconnex-Server mit der Erstellung des Datensatzes sowie Aktualisierung generiert. Dieser Wert kann nicht von Quellsystemen oder Diensten gesetzt werden.

    Bei einer erfolgreichen Anforderung zum Erstellen eines Organisationsdatensatzes wird
    diese Anforderung mit einer Repräsentation des Organisationsdatensatzes in den
    Antwort-Nutzdaten und dem HTTP Status Code 201 quittiert.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: './components-Organisation.yaml'
  responses:
    '201':
      description: OK
      content:
        application/json:
          schema:
            $ref: './components-qs-Organisationen-GET-request.yaml'
    '304':
      description: Not Modified
    '400':
      description: |
        Bad Request

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '401':
      description: |
        Unauthorized

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '403':
      description: |
        Forbidden

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '404':
      description: |
        Not found

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '405':
      description: |
        Method not allowed

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
    '409':
      description: |
        Conflict

        Siehe [Fehlerbehandlung](../../../schnittstellendefinition/http-statuscodes-qs)
